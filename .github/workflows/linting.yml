name: Linting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Setup
        run: |
          brew install swiftlint
          swiftlint version

      - name: Build
        run: pnpm build

      - name: Linting
        run: |
          pnpm test
          pnpm run lint:swift
          pnpm run lint:webext
