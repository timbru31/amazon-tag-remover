name: Linting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Setup
        run: |
          brew install swiftlint
          swiftlint version

      - name: Build
        run: pnpm build

      - name: Linting
        run: |
          pnpm test
          pnpm run lint:swift
          pnpm run lint:webext

  auto-merge:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Automatically merge dependabot upgrades
        uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
          target: minor
